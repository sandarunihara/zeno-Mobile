server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc: # <-- THIS IS THE MAGIC WORD!
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE 
              predicates:
                - Path=/api/auth/**
            - id: core-service
              uri: lb://CORE-SERVICE
              predicates:
                - Path=/api/core/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/